<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f4a3a" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>השבצק שלי</title>
  </head>
  <body>
    <header class="top">
      <h1>השבצק שלי</h1>
      <button id="now-toggle" class="pill" type="button">מי במשמרת עכשיו</button>
      <button id="refresh" class="refresh" type="button" aria-label="רענון">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z" />
        </svg>
      </button>
    </header>
    <main>
      <p id="status" class="status" role="status"></p>
      <section id="picker" class="picker" hidden>
        <input id="search" type="search" placeholder="חיפוש שם…" autocomplete="off" />
        <ul id="names" class="names"></ul>
      </section>
      <section id="soldier" class="soldier" hidden>
        <div class="soldier-head">
          <h2 id="soldier-name"></h2>
          <button id="change" type="button" class="link">החלפת חייל</button>
        </div>
        <div id="schedule"></div>
      </section>
      <section id="now" class="now" hidden>
        <div class="soldier-head">
          <h2>במשמרת עכשיו</h2>
        </div>
        <div id="now-list"></div>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
